plugins {
    id 'com.android.application'
}

android {
    namespace 'com.uniqueselect.hmr'
    compileSdk 34

    defaultConfig {
        applicationId "com.uniqueselect.hmr"
        minSdk 30
        targetSdk 34
        versionCode 127
        versionName "1.2.7"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // Pure vanilla Android framework WebKit - Zero external third-party bloat
}
